name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Unformatted files:"; echo "$out"; gofmt -d .; exit 1; fi
      - run: go vet ./...
      - run: cd examples/mcp-otel-go && go build ./... && go vet ./...
      - run: go test -race ./...
      - name: govulncheck
        run: make vuln
      - name: staticcheck
        run: make lint
      - name: doctor smoke test on fixtures
        run: |
          go run ./cmd/mcp-reliability doctor testdata/healthy.jsonl
          if go run ./cmd/mcp-reliability doctor testdata/missing-method-attr.jsonl; then echo "expected FAIL exit"; exit 1; fi
