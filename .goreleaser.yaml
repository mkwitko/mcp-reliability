version: 2
project_name: mcp-reliability
builds:
  - main: ./cmd/mcp-reliability
    binary: mcp-reliability
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
changelog:
  use: github
  filters:
    exclude: ["^chore", "^docs", "^test"]
release:
  draft: true
  prerelease: auto
