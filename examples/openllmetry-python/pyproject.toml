[project]
name = "mcp-reliability-openllmetry-example"
version = "0.0.1"
description = "Scenario harness: MCP Python SDK 1.x + traceloop opentelemetry-instrumentation-mcp over Streamable HTTP"
requires-python = ">=3.12"
dependencies = [
    # mcp 1.x: instrumentation 0.62.4 does not bootstrap on mcp 2.x (traceloop/openllmetry#4413).
    "mcp==1.30.0",
    "opentelemetry-instrumentation-mcp==0.62.4",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[tool.uv]
package = false
